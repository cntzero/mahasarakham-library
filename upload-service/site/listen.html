<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MAHA · Listen and explore</title><link rel="stylesheet" href="/studio.css?v=1"><link rel="stylesheet" href="/listen.css?v=library-button-1"><script src="/listen.js?v=context-library-1" defer></script><link rel="stylesheet" href="/player-visualizer.css?v=1"><script src="/player-visualizer.js?v=1" defer></script></head><body><a class="listen-skip" href="#listen-player">Skip to music controls</a><main id="workspace" aria-label="MAHA workspace"><iframe id="page-frame" title="MAHA page"></iframe><iframe id="music-frame" title="MAHA music library" allow="autoplay" hidden></iframe></main><section id="listen-player" aria-label="Music player" hidden><div class="listen-compact"><img id="dock-cover" alt="" hidden><span id="dock-placeholder" aria-hidden="true">♫</span><button id="dock-expand" aria-expanded="false" aria-controls="dock-panel"><strong id="dock-title">Music</strong><small id="dock-artist"></small></button><button id="dock-prev" aria-label="Previous song">⏮</button><button id="dock-play" aria-label="Pause">Ⅱ</button><button id="dock-next" aria-label="Next song">⏭</button><button id="dock-toggle" aria-label="Expand music player" aria-expanded="false" aria-controls="dock-panel">⌃</button></div><div id="dock-panel" hidden><div class="listen-panel-head"><h2>Now playing</h2><button id="dock-favorite" aria-label="Add current track to Liked Songs" aria-pressed="false" title="Add to Liked Songs"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg></button><button id="dock-collapse" aria-label="Collapse music player">⌄</button></div><div class="listen-artwork"><img id="panel-cover" alt="" hidden><span id="panel-placeholder" aria-hidden="true">♫</span><div><strong id="panel-title"></strong><span id="panel-artist"></span><span id="panel-album"></span></div></div><label class="listen-seek"><span id="dock-time">0:00</span><input id="dock-seek" type="range" min="0" max="100" value="0" aria-label="Playback position"><span id="dock-duration">0:00</span></label><div class="listen-options"><button id="dock-shuffle" aria-pressed="false">Shuffle</button><button id="dock-repeat" aria-pressed="false">Repeat</button><label>Volume<input id="dock-volume" type="range" min="0" max="1" step="0.05" value="1"></label></div><a id="dock-library" href="music.html">Open Music library →</a><div class="listen-tabs" role="group" aria-label="Browse music in player"><button data-mode="queue" aria-pressed="true">Queue</button><button data-mode="album" aria-pressed="false">Album</button><button data-mode="playlists" aria-pressed="false">Playlists</button></div><label id="dock-search-label">Search queue<input id="dock-search" type="search" placeholder="Filter songs…"></label><button id="dock-back" hidden>← Playlists</button><ol id="dock-list" aria-label="Songs in player"></ol><p id="dock-note" role="status"></p><button id="dock-stop">Stop and close player</button></div><p id="dock-status" role="status"></p></section><div id="listen-error" role="status" hidden><p>Could not open this MAHA page.</p><a href="index.html">Return to MAHA</a></div></body></html>
