server {
    listen 192.168.1.64:80 default_server;
    server_name _;
    root /srv/www/maha-library/current/dist;
    index index.html;
    autoindex off;
    allow 192.168.1.0/24;
    allow 127.0.0.1;
    deny all;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /kiwix { return 302 /kiwix/; }
    location /kiwix/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    # Preserve raw files on disk; expose captured pages and assets as static content.
    location ~* ^/archive/(?:.*/)?(?:cookies\.txt|hts-log\.txt|hts-cache)(?:/|$) { return 403; }
    location /archive/ {
        alias /srv/maha-data/library/web-articles/originals/;
        autoindex off;
        add_header Content-Security-Policy "sandbox; default-src 'self' data:; script-src 'none'; connect-src 'none'; style-src 'self' 'unsafe-inline'; form-action 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        limit_except GET { deny all; }
    }
    location / { try_files $uri $uri/ =404; }
    location /files/humble/ {
        alias /srv/maha-data/library/humble-books/originals/;
        limit_except GET { deny all; }
    }
    location /files/bushcraft/ {
        alias /srv/maha-data/library/bushcraft/epub/;
        limit_except GET { deny all; }
    }
    location /files/backwoods/ {
        alias /srv/maha-data/library/backwoods/originals/;
        limit_except GET { deny all; }
    }
    location /files/who/ {
        alias /srv/maha-data/library/who-wash/;
        limit_except GET { deny all; }
    }
}
